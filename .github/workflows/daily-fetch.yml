# 매일 한국시간 오전 8시경 플랫폼 랭킹·히스토리 JSON 갱신 (UTC 23:00 = KST 익일 08:00)
name: Daily fetch rankings

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write # 수집 실패 시 이슈로 알림

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 부분 실패(exit 2)여도 모은 데이터는 저장됨 → 커밋은 항상 시도하고, 실패 여부만 기록
      - name: Fetch rankings
        id: fetch
        continue-on-error: true
        run: npm run fetch:live

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/today_womens_rankings.json src/historical_trends.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily platform rankings (KST snapshot)"
            git push
          fi

      # 수집이 실패(또는 부분 실패)했으면 이슈로 알림 + 잡을 실패 처리
      - name: Alert on failure
        if: steps.fetch.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 일일 랭킹 수집 실패 (${new Date().toISOString().slice(0,10)})`,
              body: `자동 수집이 실패하거나 일부 플랫폼이 누락됐습니다.\n\n- 실행 로그: ${run}\n\n로그의 "수집 요약"에서 어떤 플랫폼이 실패했는지 확인하세요. 사이트 구조 변경(특히 29CM·W컨셉)일 가능성이 큽니다.`,
              labels: ['crawl-failure'],
            });
            core.setFailed('수집 실패 — 이슈를 생성했습니다.');
